[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-training-data-factory"
version = "0.1.0"
description = "Enterprise-style training data factory for LLMs"
authors = [{ name = "Pugalenthi Magendran" }]
requires-python = ">=3.9"

# Runtime dependencies
dependencies = [
    "pypdf>=6.0.0",
    "requests>=2.0.0",
    "openai>=2.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tdr = "training_data_robo.cli:main"
