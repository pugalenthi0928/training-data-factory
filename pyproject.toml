[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-training-data"
version = "0.12.0"
description = "Source-aware training data generation, quality checks, and evaluation workflows"
authors = [{ name = "Pugalenthi Magendran" }]
requires-python = ">=3.11"

# Runtime dependencies
dependencies = [
    "pypdf>=6.0.0",
    "requests>=2.0.0",
    "openai>=2.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.10,<2.0",
    "hypothesis>=6.0",
    "rouge-score>=0.1.2",
]
mlx = [
    "mlx>=0.12.0",
    "mlx-lm>=0.12.0",
    "transformers>=4.35.0",
]
semantic = [
    "sentence-transformers>=5.0.0,<6.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
forge = "forge.cli:main"
tdr = "training_data_robo.cli:main"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E701",   # multiple statements on one line (colon), existing code style
    "E702",   # multiple statements on one line (semicolon), existing code style
    "SIM108", # ternary operator (readability)
]

[tool.ruff.lint.isort]
known-first-party = ["forge", "training_data_robo"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
