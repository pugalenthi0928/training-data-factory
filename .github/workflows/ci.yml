name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints-dev.txt ruff
      - name: Lint
        run: ruff check src/ scripts/ tests/
      - name: Format check
        run: ruff format --check src/ scripts/ tests/

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Type check
        run: mypy src/training_data_robo/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt -e ".[dev]"
      - name: Syntax check
        run: python -m py_compile app.py scripts/*.py
      - name: Run tests with coverage
        run: pytest --cov=training_data_robo --cov-report=term-missing --cov-fail-under=70
